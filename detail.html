<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuke Trade - Token Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #060b0a; color: #c8e0d4; font-family: 'JetBrains Mono', monospace; }
        .stat-box { background: #111c18; border: 1px solid #1a2e26; border-radius: 8px; padding: 12px; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-3xl mx-auto">
    <!-- Back Button -->
    <button onclick="window.history.back()" class="text-chain-muted hover:text-chain-bright mb-6 text-sm flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
    </button>

    <!-- Header Info -->
    <div class="flex items-center gap-4 mb-6">
        <img id="tokenImg" src="" class="w-10 h-10 rounded-full hidden" alt="">
        <div>
            <h1 class="text-2xl font-bold text-chain-bright"><span id="tokenName">Loading...</span> <span id="tokenSymbol" class="text-chain-muted text-sm uppercase"></span></h1>
        </div>
    </div>

    <!-- Price & Change -->
    <div class="mb-8">
        <div class="text-4xl font-bold text-chain-bright" id="tokenPrice">$0.00</div>
        <div class="text-sm mt-1" id="tokenChange">+0.00%</div>
    </div>

    <!-- Chart -->
    <div class="bg-[#111c18] border border-[#1a2e26] rounded-xl p-4 mb-8" style="height: 300px;">
        <canvas id="priceChart"></canvas>
    </div>

    <!-- Positioning Board Table (Layout Baru) -->
    <div class="bg-[#111c18] border border-[#1a2e26] rounded-xl p-4 mb-8 overflow-x-auto">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-sm font-bold text-chain-bright uppercase">Positioning Board</h3>
            <span id="pbTimestamp" class="text-[10px] text-chain-muted">--</span>
        </div>
        <table class="w-full text-left text-xs min-w-[600px]">
            <thead>
                <tr class="text-chain-muted border-b border-[#1a2e26]">
                    <th class="py-2 px-2 font-medium w-1/4">Asset</th>
                    <th class="py-2 px-2 font-medium w-1/3">Smart Money (COT)</th>
                    <th class="py-2 px-2 font-medium w-1/3">Retail</th>
                    <th class="py-2 px-2 font-medium text-right">Signal</th>
                </tr>
            </thead>
            <tbody id="positioningTableBody">
                <!-- Data diisi sama detail.js -->
            </tbody>
        </table>
    </div>


    <!-- Holders Distribution (Pie Chart - Simulasi) -->
    <div class="bg-[#111c18] border border-[#1a2e26] rounded-xl p-4 mb-8" style="height: 250px;">
        <h3 class="text-xs text-chain-muted mb-4 uppercase">Holders Distribution (Simulated)</h3>
        <canvas id="holdersChart"></canvas>
    </div>

    <script src="js/config.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
